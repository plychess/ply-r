name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("Rcpp", "testthat"), repos = "https://cloud.r-project.org")'

      - name: Build source tarball
        run: |
          Rscript -e 'status <- system2("R", c("CMD", "build", ".")); if (status != 0) quit(status = status)'

      - name: Check package (as-cran)
        run: |
          Rscript -e 'tb <- list.files(full.names = TRUE); tb <- tb[endsWith(tb, ".tar.gz")]; if (length(tb) != 1) stop("Expected exactly one tarball"); status <- system2("R", c("CMD", "check", "--as-cran", "--no-manual", tb)); if (status != 0) quit(status = status)'
