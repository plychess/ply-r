name: full-validation

on:
  workflow_dispatch:

jobs:
  heavy-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("Rcpp", "testthat"), repos = "https://cloud.r-project.org")'

      - name: Install package
        run: R CMD INSTALL .

      - name: Run full validation tests (benchmarks + perft depth 5/6)
        env:
          CI: "false"
          NOT_CRAN: "true"
        run: |
          Rscript -e 'library(testthat); library(ply); testthat::test_file("tests/testthat/test_benchmarks.R")'
          Rscript -e 'library(testthat); library(ply); testthat::test_file("tests/testthat/test_perft_depth5.R")'
          Rscript -e 'library(testthat); library(ply); testthat::test_file("tests/testthat/test_perft_depth6.R")'
